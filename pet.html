<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>桌宠</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: transparent; overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    -webkit-app-region: drag; user-select: none;
  }
  #pet-app {
    width: 180px; padding: 10px 10px 12px; margin: 4px;
    display: flex; flex-direction: column; align-items: center; position: relative;
  }
  .pet-close {
    -webkit-app-region: no-drag;
    position: absolute; top: 4px; right: 6px;
    width: 20px; height: 20px; border: none; border-radius: 50%;
    background: rgba(255, 255, 255, 0.12); color: rgba(255, 255, 255, 0.8);
    cursor: pointer; font-size: 13px; line-height: 1; display: none;
  }
  .pet-close:hover { background: rgba(255, 255, 255, 0.25); }
  #pet-app:hover .pet-close { display: block; }
  #pet-creature { width: 130px; height: 130px; display: flex; align-items: center; justify-content: center; }
  .pet-emoji { font-size: 78px; line-height: 1; filter: drop-shadow(0 6px 10px rgba(0,0,0,0.35)); }
  .pet-img { width: 110px; height: 110px; object-fit: contain; filter: drop-shadow(0 6px 10px rgba(0,0,0,0.35)); }
  .pet-moodbadge {
    position: absolute; top: 78px; right: 22px; font-size: 26px;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
  }
  .pet-bubble {
    max-width: 168px; margin-top: 6px; padding: 7px 11px;
    background: rgba(20, 20, 28, 0.92); color: #fff; font-size: 12.5px; line-height: 1.45;
    border-radius: 12px; text-align: center; word-break: break-word;
    box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.08);
  }
  .pet-bubble.good { border-color: rgba(62, 207, 142, 0.5); }
  .pet-obs {
    display: none; align-items: center; gap: 5px; margin-top: 8px;
    font-size: 11px; color: #ff6b8b; font-weight: 600;
  }
  .pet-obs.on { display: flex; }
  .pet-obs-dot {
    width: 8px; height: 8px; border-radius: 50%; background: #FF2E7E;
    box-shadow: 0 0 8px #FF2E7E; animation: petPulse 1.1s infinite;
  }
  @keyframes petPulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.7); } }
</style>
</head>
<body>
  <div id="pet-app">
    <button class="pet-close" id="pet-close" title="收起桌宠">×</button>
    <div id="pet-creature"></div>
    <div class="pet-bubble" id="pet-bubble"></div>
    <div class="pet-obs" id="pet-obs"><span class="pet-obs-dot"></span>观测中（截图仅发往你自己的接口）</div>
  </div>
  <script src="pet.js"></script>
</body>
</html>
